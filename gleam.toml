name = "glexer"
version = "2.5.0"
description = "A lexer for Gleam (macabre python-target port of glexer)"

licences = ["MIT"]
repository = { type = "github", user = "dusty-phillips", repo = "macabre_glexer" }

[dependencies]
gleam_stdlib = { git = "git@github.com:dusty-phillips/macabre_stdlib.git", ref = "main" }
splitter = { git = "git@github.com:dusty-phillips/macabre_splitter.git", ref = "main" }

[dev-dependencies]
gleeunit = { git = "git@github.com:dusty-phillips/macabre_gleeunit.git", ref = "main" }
simplifile = { git = "git@github.com:dusty-phillips/macabre_simplifile.git", ref = "main" }
